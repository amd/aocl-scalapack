name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ "amd-main" ]
  pull_request:
    branches: [ "amd-main" ]
  schedule:
    - cron: '42 19 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}) - ${{ matrix.compiler }}
    runs-on: amd_linux
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
            compiler: gcc
          - language: c-cpp
            build-mode: manual
            compiler: aocc
          - language: python
            build-mode: none
            compiler: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}
          queries: security-and-quality

      # Build
      - name: Build
        if: matrix['build-mode'] == 'manual'
        shell: bash
        run: |
          # Remove broken Python cmake wrapper from PATH; ensure real cmake is used
          FILTERED_PATH="$(echo "$PATH" | tr ':' '\n' | grep -v '/home/amd/.local/bin' | paste -sd ':' -)"
          export PATH="/usr/bin${FILTERED_PATH:+:$FILTERED_PATH}"

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export GCC_PATH=/usr/bin
            export CC=${GCC_PATH}/gcc
            export CXX=${GCC_PATH}/g++
            export FC=${GCC_PATH}/gfortran
            export OPENMPI=/home/amd/mpi5.1.0/openmpi-5.0.1/openMPI_gcc
            export AOCL_ROOT=/home/amd/aocl-daily-lib/daily/gcc/MT
          else
            export AOCC_INSTALL_PATH=/home/amd/aocc-compiler-5.2.0
            export CC=${AOCC_INSTALL_PATH}/bin/clang
            export CXX=${AOCC_INSTALL_PATH}/bin/clang++
            export FC=${AOCC_INSTALL_PATH}/bin/flang
            export OPENMPI=/home/amd/mpi5.1.0/aocc/openmpi-5.0.1/openMPI_aocc
            export AOCL_ROOT=/home/amd/aocl-daily-lib/daily/aocc/MT
            export PATH="${AOCC_INSTALL_PATH}/bin:${PATH}"
            export LD_LIBRARY_PATH="${AOCC_INSTALL_PATH}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          fi

          export PATH="${OPENMPI}/bin:${PATH}"
          export LD_LIBRARY_PATH="${OPENMPI}/lib:${AOCL_ROOT}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

          mkdir -p build
          cmake -S . -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DBLAS_LIBRARIES="-fopenmp ${AOCL_ROOT}/lib/libblis-mt.a" \
            -DLAPACK_LIBRARIES="${AOCL_ROOT}/lib/libflame.a;${AOCL_ROOT}/lib/libaoclutils.a;-lstdc++" \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_Fortran_COMPILER=mpif90 \
            -DUSE_OPTIMIZED_LAPACK_BLAS=OFF \
            -DENABLE_LARGE_MATRIX_TESTING=ON
          cmake --build build -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}-${{ matrix.compiler }}"
